<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="WarpSAC: regime-aware scalable off-policy reinforcement learning.">
  <title>WarpSAC</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      color: #17151b;
      background: #f7f7f5;
    }

    * {
      box-sizing: border-box;
      letter-spacing: 0;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #f7f7f5;
    }

    main {
      width: min(1120px, 100%);
      min-height: min(760px, 88vh);
      padding: 56px 64px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #ffffff url("warp-mark.png") center / contain no-repeat;
      border-top: 4px solid #7436b0;
    }

    .brand {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .hero {
      max-width: 680px;
      padding: 48px 0;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 84px;
      line-height: 0.95;
      font-weight: 800;
    }

    .subtitle {
      margin: 0;
      max-width: 620px;
      font-size: 24px;
      line-height: 1.35;
      font-weight: 600;
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      padding-top: 20px;
      border-top: 1px solid #d8d6dc;
      font-size: 14px;
      color: #56515d;
    }

    @media (max-width: 700px) {
      main {
        min-height: 82vh;
        padding: 32px 24px;
        background-size: 150%;
      }

      h1 {
        font-size: 52px;
      }

      .subtitle {
        font-size: 20px;
      }

      footer {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="brand">WarpSAC</p>
    <section class="hero" aria-labelledby="page-title">
      <h1 id="page-title">WarpSAC</h1>
      <p class="subtitle">Regime-aware scalable off-policy reinforcement learning.</p>
    </section>
    <footer>
      <span>Project page reserved.</span>
      <span>Paper and code will be released together.</span>
    </footer>
  </main>
</body>
</html>
