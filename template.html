<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{description}}">
  <title>{{title}} | Research Project</title>

  <link href="https://fonts.googleapis.com/css?family=Google+Sans|Noto+Sans|Castoro" rel="stylesheet">
  <link rel="stylesheet" href="./static/css/bulma.min.css">
  <link rel="stylesheet" href="./static/css/bulma-carousel.min.css">
  <link rel="stylesheet" href="./static/css/fontawesome.all.min.css">
  <link rel="stylesheet" href="./static/css/index.css">
  <link rel="stylesheet" href="./static/css/warpsac.css">

  <script defer src="./static/js/fontawesome.all.min.js"></script>
  <script src="./static/js/bulma-carousel.min.js"></script>
</head>
<body>
<nav class="navbar project-navbar" role="navigation" aria-label="Project navigation">
  <div class="navbar-menu is-active">
    <div class="navbar-start">
      <a class="navbar-item" href="./" aria-label="WarpSAC home" title="WarpSAC home">
        <span class="icon"><i class="fas fa-home" aria-hidden="true"></i></span>
      </a>
      <a class="navbar-item" href="#results">Results</a>
      <a class="navbar-item" href="#getting-started">Getting started</a>
      <a class="navbar-item" href="#citation">Citation</a>
    </div>
  </div>
</nav>
{{sections}}

<footer class="footer">
  <div class="container">
    <div class="content has-text-centered">
      <p>{{title}} · Official project page</p>
    </div>
  </div>
</footer>

<script>
  const darkModeToggle = document.querySelector('[data-dark-mode]');
  if (darkModeToggle) {
    const themeKey = 'warpsac-theme-v2';
    const savedTheme = localStorage.getItem(themeKey);
    darkModeToggle.checked = savedTheme === 'dark';
    document.body.classList.toggle('dark-mode', darkModeToggle.checked);
    darkModeToggle.addEventListener('change', () => {
      document.body.classList.toggle('dark-mode', darkModeToggle.checked);
      localStorage.setItem(themeKey, darkModeToggle.checked ? 'dark' : 'light');
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    if (typeof bulmaCarousel !== 'undefined') {
      bulmaCarousel.attach('.carousel', {
        slidesToScroll: 1,
        slidesToShow: 1,
        loop: true,
        infinite: true,
        autoplay: false,
      });
    }
  });
</script>
</body>
</html>
